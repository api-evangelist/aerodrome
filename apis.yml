name: Aerodrome
description: >-
  Aerodrome Finance is the central trading and liquidity marketplace on the Base
  network — a next-generation MetaDEX (automated market maker inspired by
  Solidly and Velodrome) that pairs a vote-escrow ve(3,3) tokenomics model with
  gauge-directed AERO emissions. It offers basic volatile (vAMM) and stable
  (sAMM) pools plus concentrated-liquidity Slipstream pools, letting liquidity
  providers, voters, and traders coordinate incentives on Base. Aerodrome is a
  smart-contract protocol rather than a hosted API: developers integrate through
  its onchain Solidity contracts, the shared open-source "Sugar" SDK (JavaScript
  and Python) that reads pool/veNFT/relay data and builds unsigned transactions,
  and GraphQL subgraphs for analytics. This profile was enriched by the API
  Evangelist pipeline from public sources.
