notes: >-
  Aerodrome shares its "Sugar" developer SDK with Velodrome (both are built by
  Dromos Labs). The SDK is an onchain API — it reads pool / veNFT / relay data
  by calling the Sugar helper contracts and builds UNSIGNED swap / liquidity /
  stake / claim transactions ({from,to,data,value}); it never holds keys or
  signs. There is no traditional REST client library because Aerodrome is a
  smart-contract protocol on Base.
